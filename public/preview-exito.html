<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Preview — /exito check</title>
<style>
  :root { --cream:#E8DDC8; --cream-soft:#C9BBA0; --amber:#E8A33D; --black:#0A0908; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--black); color: var(--cream); font-family: Inter, -apple-system, sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 40px 16px; }
  .card { width: min(100%, 440px); text-align: center; }
  .logo { width: 68px; height: 68px; margin: 0 auto 20px; border-radius: 20px; border: 1px solid rgba(255,255,255,.14); display: grid; place-items: center; font-weight: 950; font-size: 18px; color: var(--amber); background: #111; }
  em { color: var(--amber); font-style: italic; }
</style>
</head>
<body>

<div class="card">
  <div class="logo">PQ</div>

  <!-- CHECK + TITULO -->
  <table cellpadding="0" cellspacing="0" border="0" style="margin: 0 auto 12px;">
    <tr>
      <td style="vertical-align: middle; padding-right: 12px;">
        <svg width="30" height="30" viewBox="0 0 48 48" style="display: block;">
          <circle cx="24" cy="24" r="22" fill="none" stroke="rgba(232,163,61,.2)" stroke-width="2" />
          <circle cx="24" cy="24" r="22" fill="none" stroke="#E8A33D" stroke-width="2.5" />
          <path d="M15 24l6 6 12-12" fill="none" stroke="#E8A33D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </td>
      <td style="vertical-align: middle;">
        <span style="font-family: Georgia, serif; font-size: 32px; font-weight: 400; line-height: 1.1; color: #E8DDC8;">
          Ya tienes acceso a tu <em>panel</em>
        </span>
      </td>
    </tr>
  </table>

  <p style="color: #C9BBA0; font-size: 15px; line-height: 1.5; margin-bottom: 20px;">
    Tu carta es privada. Revisala, editala y cuando este lista comparte el QR.
  </p>

  <div style="background: radial-gradient(circle at 50% 100%, rgba(232,163,61,.12), transparent 60%), rgba(255,255,255,.03); border: 1px solid rgba(232,163,61,.25); border-radius: 20px; padding: 20px; margin-bottom: 24px;">
    <div style="font-size: 32px; margin-bottom: 8px;">🎁</div>
    <div style="font-family: Georgia, serif; font-size: 20px; color: var(--amber); margin-bottom: 8px;">Tienes 7 dias de Premium gratis de regalo</div>
    <p style="font-size: 13px; color: var(--cream-soft); line-height: 1.5;">Tienes 7 dias de plan Premium gratis de regalo. Al terminar, tu carta seguira activa en el plan Gratis — sin cobros.</p>
  </div>

  <a href="#" style="display: block; width: 100%; padding: 15px; background: linear-gradient(135deg, #ffc44f, #f3a333); color: #100b03; font-size: 15px; font-weight: 900; text-decoration: none; text-align: center; border-radius: 999px; margin-bottom: 10px; box-shadow: 0 12px 28px rgba(245,164,51,.2);">
    Ir a mi panel
  </a>
  <a href="#" style="display: block; width: 100%; padding: 13px; background: transparent; border: 1px solid rgba(255,255,255,.15); color: var(--cream-soft); font-size: 14px; font-weight: 600; text-decoration: none; text-align: center; border-radius: 999px;">
    Ver mi carta
  </a>
</div>

</body>
</html>
