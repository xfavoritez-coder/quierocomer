<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Oferta Card Mobile</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      background:#050505;
      color:#fff;
      font-family:Inter,system-ui,sans-serif;
      padding:18px;
    }
    .phone{
      width:min(100%,390px);
    }
    .title{
      font-family:'Bebas Neue',Impact,sans-serif;
      font-size:42px;
      letter-spacing:1px;
      margin:0 0 16px;
    }
    .offer-card{
      height:260px;
      border-radius:30px;
      position:relative;
      overflow:hidden;
      border:1px solid rgba(255,178,26,.32);
      background:#111;
      box-shadow:0 28px 80px rgba(0,0,0,.65), inset 0 0 34px rgba(255,178,26,.06);
    }
    .offer-card::before{
      content:"";
      position:absolute;
      inset:0;
      background:
        linear-gradient(to right, rgba(0,0,0,.96) 0%, rgba(0,0,0,.78) 43%, rgba(0,0,0,.12) 100%),
        linear-gradient(to top, rgba(0,0,0,.85) 0%, transparent 58%),
        url('https://images.unsplash.com/photo-1579584425555-c3ce17fd4351?q=90&w=1200&auto=format&fit=crop') center right/cover;
      transform:scale(1.04);
    }
    .badge{
      position:absolute;
      top:15px;
      right:15px;
      z-index:2;
      background:#ffb21a;
      color:#111;
      border-radius:999px;
      padding:9px 13px;
      font-size:11px;
      font-weight:900;
      letter-spacing:.6px;
      text-transform:uppercase;
    }
    .content{
      position:absolute;
      z-index:2;
      left:18px;
      right:18px;
      bottom:18px;
      max-width:260px;
    }
    .kicker{
      color:#ffb21a;
      font-size:11px;
      font-weight:900;
      letter-spacing:.7px;
      text-transform:uppercase;
      margin-bottom:9px;
    }
    h2{
      margin:0;
      font-family:'Bebas Neue',Impact,sans-serif;
      font-size:56px;
      line-height:.8;
      letter-spacing:.5px;
      text-shadow:0 6px 28px rgba(0,0,0,.9);
    }
    h2 span{
      display:block;
      color:#ffb21a;
      font-size:44px;
    }
    p{
      margin:13px 0 14px;
      color:#ddd3c8;
      font-size:13px;
      line-height:1.42;
      display:-webkit-box;
      -webkit-line-clamp:2;
      -webkit-box-orient:vertical;
      overflow:hidden;
    }
    .price-row{
      display:flex;
      align-items:baseline;
      gap:12px;
    }
    .price{
      color:#ffb21a;
      font-size:31px;
      font-weight:900;
      letter-spacing:-1px;
    }
    del{
      color:#888;
      font-size:16px;
      font-weight:800;
    }
  </style>
</head>
<body>
  <main class="phone">
    <h1 class="title">Ofertas</h1>

    <article class="offer-card">
      <div class="badge">Hoy viernes</div>

      <div class="content">
        <div class="kicker">Favorito del viernes</div>
        <h2>Tiger <span>Roll Night</span></h2>
        <p>+ 8 piezas de Tiger Roll, salmón furai, queso crema, palta y salsa especial.</p>
        <div class="price-row">
          <div class="price">$23.900</div>
          <del>$25.900</del>
        </div>
      </div>
    </article>
  </main>
</body>
</html>
